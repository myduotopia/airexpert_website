<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Inter','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="48" y="60" fill="#2f8f5c" font-size="15" font-weight="700" letter-spacing="2">SMART DRYER · 冷凍式乾燥機</text>
  <text x="48" y="94" fill="#16201a" font-size="27" font-weight="700">儲能型 vs 傳統型</text>

  <!-- Traditional card -->
  <rect x="48" y="130" width="330" height="320" rx="16" fill="#ffffff" stroke="#dce8dd" stroke-width="1.5"/>
  <text x="72" y="172" fill="#16201a" font-size="19" font-weight="700">傳統型</text>
  <text x="354" y="172" text-anchor="end" fill="#9a8250" font-size="14" font-weight="600">持續耗電</text>
  <!-- always-on machine -->
  <rect x="72" y="200" width="282" height="90" rx="10" fill="#f1f6f1" stroke="#dce8dd"/>
  <circle cx="118" cy="245" r="24" fill="#c8d2cc"/>
  <text x="118" y="251" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">⟳</text>
  <text x="160" y="238" fill="#16201a" font-size="15" font-weight="600">壓縮機／風扇</text>
  <text x="160" y="262" fill="#5c6b61" font-size="13.5">必須持續作動維持冷媒</text>
  <text x="72" y="330" fill="#5c6b61" font-size="14">即使用氣量下降，</text>
  <text x="72" y="354" fill="#5c6b61" font-size="14">仍照常運轉、照常耗電。</text>
  <text x="72" y="410" fill="#9aa7a0" font-size="15" font-weight="700">能耗基準　100%</text>

  <!-- Storage card -->
  <rect x="422" y="130" width="330" height="320" rx="16" fill="#f1f6f1" stroke="#2f8f5c" stroke-width="2"/>
  <text x="446" y="172" fill="#16201a" font-size="19" font-weight="700">儲能型（PCM）</text>
  <text x="730" y="172" text-anchor="end" fill="#2f8f5c" font-size="14" font-weight="700">可休息節電</text>
  <rect x="446" y="200" width="282" height="90" rx="10" fill="#ffffff" stroke="#dce8dd"/>
  <circle cx="492" cy="245" r="24" fill="#2f8f5c"/>
  <text x="492" y="252" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">PCM</text>
  <text x="534" y="238" fill="#16201a" font-size="15" font-weight="600">相變材料儲冷</text>
  <text x="534" y="262" fill="#5c6b61" font-size="13.5">凍結時壓縮機／風扇停止</text>
  <text x="446" y="330" fill="#5c6b61" font-size="14">依用氣量彈性休息或運轉，</text>
  <text x="446" y="354" fill="#5c6b61" font-size="14">不影響效能。</text>
  <text x="446" y="410" fill="#1f6b43" font-size="15" font-weight="800">卻水效果再提升 10~20%</text>
</svg>
